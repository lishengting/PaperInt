# =============================================================================
# Shared Configuration for Paper Downloading and Interpretation Skills
# =============================================================================
#
# This file is the single source of truth for all configurable parameters.
# Edit this file to tune keywords, system prompts, tag definitions, and API
# endpoints without touching scripts or SKILL.md files.
#
# =============================================================================

# --- API Endpoints ---
apis:
  arxiv:
    search_url: "https://export.arxiv.org/api/query"
    pdf_url_template: "https://arxiv.org/pdf/{arxiv_id}.pdf"
    abs_url_template: "https://arxiv.org/abs/{arxiv_id}"
    categories:
      - "q-bio.BM"
      - "q-bio.GN"
      - "q-bio.MN"
      - "q-bio.CB"
      - "cs.CE"
    max_results: 50
  biorxiv:
    base_url: "https://api.biorxiv.org"
  medrxiv:
    base_url: "https://api.medrxiv.org"
  pubmed:
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"

# --- CNSP (Cell/Nature/Science/PLOS) Journal Scraping ---
cnsp:
  nature_journals: "skills/bio-paper-search/scripts/journals_config/nature_journals.json"
  science_journals: "skills/bio-paper-search/scripts/journals_config/science_journals.json"
  cell_journals: "skills/bio-paper-search/scripts/journals_config/cell_journals.json"
  plos_journals: "skills/bio-paper-search/scripts/journals_config/plos_journals.json"
  default_days_back: 7
  incremental_days_back: 90
  include_journals: []
  nature:
    enabled: true
    request_delay_seconds: 1.5
  science:
    enabled: true
    request_delay_seconds: 3
    use_browser: true
  cell:
    enabled: true
    request_delay_seconds: 2
    use_browser: true
  plos:
    enabled: true
    request_delay_seconds: 2
    use_browser: true

# --- Search Defaults ---
search:
  default_source: "all"       # arxiv | biorxiv | pubmed | scholar | all
  default_num: 1                # number of papers to download
  date_range_days: 90           # lookback window for keyword/title search

# --- Download Defaults ---
download:
  date_range_days: 7
  min_pdf_size_bytes: 10000
  pdf_text_max_chars: 100000
  request_delay_seconds: 3
  user_agent: "PaperInt-Skills/1.0 (mailto:example@example.com)"
  timeout_seconds: 60

# --- Filtering Keywords ---
keywords:
  include:
    - "bioinformatic"
    - "computational biology"
    - "genomic"
    - "transcriptom"
    - "proteom"
    - "metabolom"
    - "single-cell"
    - "scrna"
    - "rna-seq"
    - "dna-seq"
    - "chip-seq"
    - "atac-seq"
    - "methylation"
    - "epigenetic"
    - "metagenom"
    - "microbiome"
    - "phylogen"
    - "sequence alignment"
    - "gene expression"
    - "protein structure"
    - "alphafold"
    - "crispr"
    - "synthetic biology"
    - "systems biology"
    - "single cell"
    - "spatial transcript"
    - "scRNA-seq"
    - "bulk RNA-seq"
    - "whole genome"
    - "whole exome"
    - "variant calling"
    - "snp calling"
    - "differential expression"
    - "pathway analysis"
    - "network analysis"
    - "machine learning"
    - "deep learning"
    - "neural network"
    - "language model"
  include_min_match: 2

  exclude:
    - "ethereum"
    - "bitcoin"
    - "cryptocurrency"
    - "blockchain"
    - "financial trading"
    - "stock market"
    - "aeroelastic"
    - "flight dynamic"
    - "gust load"
    - "concrete"
    - "battery electrode"
    - "electromagnetic"
    - "microwave"
    - "control system"
    - "feedback linearisation"
    - "UAV"
    - "aircraft"
    - "cantilevered plate"
    - "damage identification"
    - "frequency response"
    - "flight dynamics"
    - "gust alleviation"
    - "nonlinear aeroelastic"

# --- Tag Definitions ---
tags:
  definitions:
    - id: 18
      label: "单细胞测序"
      patterns:
        - "\\bsingle.cell\\b"
        - "\\bscrna\\b"
        - "\\bscRNA-seq\\b"
        - "\\bspatial transcriptom"
    - id: 17
      label: "RNA-seq"
      patterns:
        - "\\brna-seq\\b"
        - "\\btranscriptom\\b"
        - "\\bdifferential expression\\b"
    - id: 19
      label: "基因组学"
      patterns:
        - "\\bgenom\\b"
        - "\\bwhole genome\\b"
        - "\\bwhole exome\\b"
        - "\\bwgs\\b"
        - "\\bwes\\b"
    - id: 20
      label: "蛋白质组学"
      patterns:
        - "\\bproteom\\b"
        - "\\bprotein structure\\b"
        - "\\bprotein sequence\\b"
        - "\\bamino acid\\b"
    - id: 21
      label: "代谢组学"
      patterns:
        - "\\bmetabolom\\b"
        - "\\bmetabolite\\b"
    - id: 22
      label: "多组学整合"
      patterns:
        - "\\bmulti.omics?\\b"
        - "\\bintegrative\\b"
    - id: 23
      label: "表观遗传"
      patterns:
        - "\\bepigenetic\\b"
        - "\\bchip-seq\\b"
        - "\\batac-seq\\b"
        - "\\bmethylation\\b"
        - "\\bhistone\\b"
    - id: 24
      label: "宏基因组"
      patterns:
        - "\\bmetagenom\\b"
        - "\\bmicrobiome\\b"
        - "\\b16s\\b"
    - id: 29
      label: "深度学习"
      patterns:
        - "\\bdeep learning\\b"
        - "\\bneural network\\b"
        - "\\bcnn\\b"
        - "\\brnn\\b"
        - "\\blstm\\b"
        - "\\btransformer\\b"
    - id: 28
      label: "机器学习"
      patterns:
        - "\\bmachine learning\\b"
        - "\\brandom forest\\b"
        - "\\bsvm\\b"
        - "\\bgradient boosting\\b"
    - id: 11
      label: "AlphaFold"
      patterns:
        - "\\balphafold\\b"
        - "\\bprotein folding\\b"
    - id: 12
      label: "大语言模型"
      patterns:
        - "\\blarge language model\\b"
        - "\\bllm\\b"
        - "\\bgpt\\b"
  base_tag_ids: [2, 9]
  ai_parent_tag_id: 1

# --- LLM Configuration ---
llm:
  api_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: "LLM_API_KEY"
  model: "deepseek-v4-pro"
  backup_model: "qwen3-235b-a22b"
  backup_base_url: "http://localhost:8080/v1"
  temperature: 0.3
  max_tokens: 100000
  timeout_seconds: 120

# --- Database ---
db:
  path: "data/papers.db"

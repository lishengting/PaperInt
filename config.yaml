# =============================================================================
# Shared Configuration for Paper Downloading and Interpretation Skills
# =============================================================================
#
# This file is the single source of truth for all configurable parameters.
# Edit this file to tune keywords, system prompts, tag definitions, and API
# endpoints without touching scripts or SKILL.md files.
#
# =============================================================================

# --- API Endpoints ---
apis:
  arxiv:
    search_url: "https://export.arxiv.org/api/query"
    pdf_url_template: "https://arxiv.org/pdf/{arxiv_id}.pdf"
    abs_url_template: "https://arxiv.org/abs/{arxiv_id}"
    categories:
      - "q-bio.BM"
      - "q-bio.GN"
      - "q-bio.MN"
      - "q-bio.CB"
      - "cs.CE"
    max_results: 50
  biorxiv:
    base_url: "https://api.biorxiv.org"
  medrxiv:
    base_url: "https://api.medrxiv.org"
  pubmed:
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"

# --- Search Defaults ---
search:
  default_source: "all"       # arxiv | biorxiv | pubmed | scholar | all
  default_num: 1                # number of papers to download
  date_range_days: 90           # lookback window for keyword/title search

# --- Download Defaults ---
download:
  date_range_days: 7
  min_pdf_size_bytes: 10000
  pdf_text_max_chars: 100000
  request_delay_seconds: 3
  user_agent: "PaperInt-Skills/1.0 (mailto:example@example.com)"
  timeout_seconds: 60

# --- Filtering Keywords ---
keywords:
  include:
    - "bioinformatic"
    - "computational biology"
    - "genomic"
    - "transcriptom"
    - "proteom"
    - "metabolom"
    - "single-cell"
    - "scrna"
    - "rna-seq"
    - "dna-seq"
    - "chip-seq"
    - "atac-seq"
    - "methylation"
    - "epigenetic"
    - "metagenom"
    - "microbiome"
    - "phylogen"
    - "sequence alignment"
    - "gene expression"
    - "protein structure"
    - "alphafold"
    - "crispr"
    - "synthetic biology"
    - "systems biology"
    - "single cell"
    - "spatial transcript"
    - "scRNA-seq"
    - "bulk RNA-seq"
    - "whole genome"
    - "whole exome"
    - "variant calling"
    - "snp calling"
    - "differential expression"
    - "pathway analysis"
    - "network analysis"
    - "machine learning"
    - "deep learning"
    - "neural network"
    - "language model"
  include_min_match: 2

  exclude:
    - "ethereum"
    - "bitcoin"
    - "cryptocurrency"
    - "blockchain"
    - "financial trading"
    - "stock market"
    - "aeroelastic"
    - "flight dynamic"
    - "gust load"
    - "concrete"
    - "battery electrode"
    - "electromagnetic"
    - "microwave"
    - "control system"
    - "feedback linearisation"
    - "UAV"
    - "aircraft"
    - "cantilevered plate"
    - "damage identification"
    - "frequency response"
    - "flight dynamics"
    - "gust alleviation"
    - "nonlinear aeroelastic"


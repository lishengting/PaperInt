# Convert an English article-style interpretation into Chinese with paper context.

system: |-
  You are a rigorous bioinformatics paper interpreter and scientific translator. Follow the task instructions exactly and do not invent unsupported claims.

user_template: |-
  {paper_context}

  TASK: Convert the following generated English article-style paper interpretation into Simplified Chinese.

  The English article supplies the structure and main content. The paper context above may be used to verify terminology, preserve scientific meaning, and supplement important technical details that the English article omitted. Do not switch to a different standalone Chinese interpretation template.

  Rules:
  - Preserve the Markdown structure and heading hierarchy as much as possible.
  - Translate the title into a natural Chinese title. The first line should begin with `### 【论文解读】`.
  - Preserve gene/protein/drug names, software names, database names, accession IDs, URLs, file paths, statistical notation, p-values, mathematical notation, and citation identifiers accurately.
  - If the English article marks uncertainty, translate that uncertainty faithfully.
  - You may add important missing technical details from the paper context only when they clarify or correct the English article; do not invent or over-interpret.
  - Return Markdown only. Do not add code fences, commentary, or prefaces.

  ENGLISH ARTICLE:
  {source_markdown}

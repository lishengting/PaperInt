# Brief/article-style English interpretation system prompt.

system: |-
  You are a rigorous bioinformatics paper interpreter and scientific translator. Follow the task instructions exactly and do not invent unsupported claims.

user_template: |-
  {paper_context}

  TASK: Generate a polished English article-style interpretation from the paper context above.

  Required output:
  1. Title: create an informative English title that highlights the paper's core innovation. The first line must be `### [Paper Insight] <title>`.
  2. Research Background: 300-450 words explaining the field context, open problems, and study motivation.
  3. Core Methods: 400-600 words explaining the proposed method, algorithm, experimental workflow, or technical route.
  4. Main Findings and Results: 300-450 words summarizing experiments, performance evaluation, and key findings.
  5. Discussion and Significance: 250-400 words analyzing novelty, limitations, and impact on the field.
  6. Practical Implications: 150-250 words explaining how the work may guide real bioinformatics practice.
  7. Concise Summary: 3-5 bullet points, one sentence each.

  Writing requirements:
  - Start directly with the title line; do not add any greeting or preface.
  - Write in Markdown with clear heading hierarchy.
  - Use a professional but readable style for bioinformatics researchers, graduate students, and senior engineers.
  - Explain technical details deeply rather than summarizing superficially.
  - Include concrete data, metrics, and experimental results from the paper.
  - Distinguish paper statements from reasonable inference.
  - Mark uncertainty as "not reported" instead of guessing.
  - {representative_figure_instruction}

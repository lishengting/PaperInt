# Convert an English structured interpretation report into Chinese with paper context.

system: |-
  You are a rigorous bioinformatics paper interpreter and scientific translator. Follow the task instructions exactly and do not invent unsupported claims.

user_template: |-
  {paper_context}

  TASK: Convert the following generated English structured technical report into Simplified Chinese.

  The English report supplies the structure and main content. The paper context above may be used to verify terminology, preserve scientific meaning, and supplement important technical details that the English report omitted. Do not switch to a different standalone Chinese interpretation template.

  Rules:
  - Preserve the Markdown structure, heading hierarchy, table names, and table row/column structure as much as possible.
  - Translate headings into Chinese while keeping the same section order.
  - Preserve gene/protein/drug names, software names, database names, accession IDs, URLs, file paths, statistical notation, p-values, mathematical notation, and citation identifiers accurately.
  - If the English report says "not reported", "to be determined", or marks uncertainty, translate that uncertainty faithfully.
  - You may add important missing technical details from the paper context only when they clarify or correct the English report; do not invent or over-interpret.
  - Return Markdown only. Do not add code fences, commentary, or prefaces.

  ENGLISH REPORT:
  {source_markdown}
